<style id="vtp-css">/* Layout: club letterhead (crest + wordmark) over a tie-stripe in the club colours; one large month sheet; a side column with the selected day and the next fixtures. */
:root{
  --paper:#F4F1EC; --surface:#FDFCFA; --ink:#2B1E21; --ink-2:#6C5E61; --ink-3:#A79C9B; --line:#DDD5CC;
  --club:#352628; --gold:#FBCA08; --gold-ink:#7E6100; --on-club:#F4EEE3; --on-gold:#2B1E21;
  --shield-edge:transparent; --backdrop:rgba(28,18,20,.55); --warn-bg:#FFF3C2; --err:#9B2C1F;
  --t-club:#352628; --on-t-club:#FBCA08;
  --t-brick:#8A3A2B; --t-green:#1F5A3F; --t-navy:#1F3F6E; --t-purple:#5A3672; --t-claret:#7A1F3D;
  --t-petrol:#1B5E66; --t-saddle:#8A5A2B; --t-slate:#4A5560; --on-tone:#FFFFFF;
  --f-display:"Libre Caslon Text","Baskerville","Libre Baskerville",Georgia,"Times New Roman",serif;
  --f-ui:"Gill Sans","Gill Sans MT","Cabin","Trebuchet MS",sans-serif;
  --f-block:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#191113; --surface:#231A1C; --ink:#F2EBE1; --ink-2:#B8ABA8; --ink-3:#7C6F70; --line:#3F3134;
  --club:#4A383B; --gold:#FBCA08; --gold-ink:#FBCA08; --on-club:#F4EEE3; --on-gold:#2B1E21;
  --shield-edge:#8D7C7F; --backdrop:rgba(0,0,0,.65); --warn-bg:#4A3B08; --err:#F09A8C;
  --t-club:#FBCA08; --on-t-club:#2B1E21;
  --t-brick:#E3917D; --t-green:#82C6A0; --t-navy:#93B6EA; --t-purple:#C6A5E0; --t-claret:#E893AD;
  --t-petrol:#7FC8D1; --t-saddle:#DBAA74; --t-slate:#B1BBC5; --on-tone:#1E1517;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#191113; --surface:#231A1C; --ink:#F2EBE1; --ink-2:#B8ABA8; --ink-3:#7C6F70; --line:#3F3134;
  --club:#4A383B; --gold:#FBCA08; --gold-ink:#FBCA08; --on-club:#F4EEE3; --on-gold:#2B1E21;
  --shield-edge:#8D7C7F; --backdrop:rgba(0,0,0,.65); --warn-bg:#4A3B08; --err:#F09A8C;
  --t-club:#FBCA08; --on-t-club:#2B1E21;
  --t-brick:#E3917D; --t-green:#82C6A0; --t-navy:#93B6EA; --t-purple:#C6A5E0; --t-claret:#E893AD;
  --t-petrol:#7FC8D1; --t-saddle:#DBAA74; --t-slate:#B1BBC5; --on-tone:#1E1517;
  color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.wrap{max-width:1680px;margin-inline:auto;padding-inline:clamp(16px,3vw,40px)}

/* tones */
[data-tone]{--t:var(--t-slate);--on-t:var(--on-tone)}
[data-tone="club"]{--t:var(--t-club);--on-t:var(--on-t-club)}
[data-tone="brick"]{--t:var(--t-brick)} [data-tone="green"]{--t:var(--t-green)} [data-tone="navy"]{--t:var(--t-navy)}
[data-tone="purple"]{--t:var(--t-purple)} [data-tone="claret"]{--t:var(--t-claret)} [data-tone="petrol"]{--t:var(--t-petrol)}
[data-tone="saddle"]{--t:var(--t-saddle)} [data-tone="slate"]{--t:var(--t-slate)}
.med{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--t);color:var(--on-t)}
.med svg{width:68%;height:68%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.med svg .f{fill:currentColor;stroke:none}
.med svg .th{stroke-width:.9}
.med.lg{width:46px;height:46px}

/* masthead */
.mast-in{display:flex;align-items:center;justify-content:space-between;gap:16px 32px;flex-wrap:wrap;padding-block:22px 18px}
.brand{display:flex;align-items:center;gap:18px;min-width:0}
.shield{flex:none;height:88px;width:auto}
.shield .sd{fill:#352628;stroke:var(--shield-edge);stroke-width:5;paint-order:stroke}
.shield .sg{fill:#FBCA08}
.logo{height:112px;width:auto;max-width:100%;fill:var(--ink)}
.mast-r{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.eyebrow{font:600 12px var(--f-ui);letter-spacing:.24em;text-transform:uppercase}
.est{font:italic 400 20px var(--f-display);color:var(--gold-ink)}
.tie{height:14px;background:linear-gradient(var(--club) 0 5px,var(--gold) 5px 9px,var(--club) 9px)}

/* toolbar */
.bar{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 24px;flex-wrap:wrap;padding-block:28px 14px}
.bar-l{display:flex;align-items:center;gap:14px;min-width:0;flex-wrap:wrap}
.ttl{margin:0;font:400 clamp(30px,4.4vw,46px)/1.05 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.ttl span{color:var(--ink-2);font-style:italic}
.nav{display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:0 14px;border:1px solid var(--ink);border-radius:2px;background:transparent;font:600 12px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;text-align:center;color:var(--ink);cursor:pointer}
.btn:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.btn.sq{width:36px;padding:0;font-size:18px;letter-spacing:0}
.btn.pri{background:var(--t-club);border-color:var(--t-club);color:var(--on-t-club)}
.btn.pri:hover{background:color-mix(in srgb,var(--t-club) 86%,var(--on-t-club))}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:flex}
.seg .btn{border-radius:0;margin-left:-1px}
.seg .btn:first-child{margin-left:0;border-radius:2px 0 0 2px}
.seg .btn:last-child{border-radius:0 2px 2px 0}
.seg .btn[aria-pressed="true"]{background:var(--t-club);border-color:var(--t-club);color:var(--on-t-club);position:relative}

.filters{display:flex;flex-wrap:wrap;gap:8px;padding-block:0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:3px 12px 3px 4px;border:1px solid var(--line);border-radius:18px;background:var(--surface);font:600 12px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.chip.all{padding-inline:14px}
.chip[aria-pressed="false"]{background:transparent;color:var(--ink-3);border-style:dashed}
.chip[aria-pressed="false"] .med{background:transparent;color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--ink-3)}
.chip[aria-pressed="true"]{border-color:var(--ink-2)}

.note{display:flex;gap:10px;align-items:baseline;margin-bottom:18px;padding:10px 14px;border-left:4px solid var(--gold);background:var(--warn-bg);font-size:14px}
.note b{font:600 11px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}

.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:36px;align-items:start;padding-bottom:48px}
@media (min-width:1500px){ .layout.split{grid-template-columns:minmax(0,1fr) 340px;gap:44px} }

/* month sheet */
.month{border:1px solid var(--line);border-top:2px solid var(--ink);background:var(--line)}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface);border-bottom:1px solid var(--line)}
.dow span{padding:9px 8px;font:600 11px var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px}
.day{position:relative;display:flex;flex-direction:column;gap:5px;min-width:0;min-height:132px;padding:6px 6px 8px;background:var(--surface);cursor:pointer}
.day.out{background:var(--paper);cursor:default}
.day.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.day.today::after{content:"";position:absolute;top:0;right:0;width:26px;height:26px;background:linear-gradient(225deg,var(--gold) 0 50%,transparent 50%);pointer-events:none}
.dn{align-self:flex-start;display:flex;align-items:baseline;gap:6px;padding:0 2px;border:0;background:none;font:600 20px/1 var(--f-block);font-variant-numeric:tabular-nums;cursor:pointer}
.day.out .dn{color:var(--ink-3);cursor:default}
.dn small{font:600 10px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink)}
.evs{display:flex;flex-direction:column;gap:3px;min-width:0}
.ev{display:flex;align-items:center;gap:8px;width:100%;min-width:0;padding:3px 7px 3px 3px;border:0;border-radius:13px 3px 3px 13px;background:color-mix(in srgb,var(--t) 12%,var(--surface));font:500 13px/1.2 var(--f-ui);text-align:left;cursor:pointer}
.ev:hover{background:color-mix(in srgb,var(--t) 22%,var(--surface))}
.ev-t{min-width:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.ev-t b{font:600 13px var(--f-block);letter-spacing:.02em;margin-right:5px;font-variant-numeric:tabular-nums}
.more{align-self:flex-start;padding:1px 4px;border:0;background:none;font:600 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);cursor:pointer}

@media (max-width:760px){
  .shield{height:56px} .logo{height:72px} .brand{gap:12px}
  .mast-in{padding-block:16px 12px}
  .mast-r{flex-direction:row;align-items:baseline;gap:12px;text-align:left}
  .est{font-size:16px}
  .bar{padding-block:20px 12px}
  .dow span{padding:7px 0;text-align:center;letter-spacing:.06em;font-size:10px}
  .day{min-height:76px;padding:5px 1px 6px;align-items:center;gap:4px}
  .dn{align-self:center;font-size:17px;flex-direction:column;align-items:center;gap:1px}
  .dn small{font-size:8px;letter-spacing:.08em}
  .day.today::after{width:16px;height:16px}
  .evs{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:2px}
  .ev{width:auto;padding:0;background:none;pointer-events:none}
  .ev .med{width:19px;height:19px}
  .ev-t{display:none}
  .more{align-self:center;padding:0;font-size:10px;pointer-events:none}
}

/* side column, cards */
.side{display:grid;grid-template-columns:minmax(0,1fr);gap:32px 44px;align-items:start;min-width:0}
@media (min-width:820px) and (max-width:1499px){ .side{grid-template-columns:repeat(2,minmax(0,1fr))} }
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.sec-h h2,.sec-h h3{margin:0;font:400 21px/1.2 var(--f-display)}
.sec-h small{font:600 11px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.cards{display:flex;flex-direction:column}
.card{display:grid;grid-template-columns:50px minmax(0,1fr);gap:14px;align-items:start;width:100%;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.card:hover .t{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.when{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.when b{font:600 32px/.85 var(--f-block);font-variant-numeric:tabular-nums}
.when b.tm{font-size:22px;line-height:1}
.when i{font:600 10.5px var(--f-ui);font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.body{display:flex;flex-direction:column;gap:4px;min-width:0}
.venue{display:flex;align-items:center;gap:7px;font:600 11px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.venue .med{width:20px;height:20px}
.t{font:400 18px/1.25 var(--f-display);overflow-wrap:anywhere}
.m{font-size:14px;color:var(--ink-2)}
.bdgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.bdg{padding:2px 7px;border:1px solid var(--ink-3);border-radius:2px;font:600 10.5px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.bdg.con{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.bdg.sin{border-color:var(--ink);color:var(--ink)}
.empty{margin:0;padding:16px 0;color:var(--ink-2);font:italic 400 16px var(--f-display)}
.past{opacity:.55}

/* year */
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:34px 36px}
.mini{min-width:0}
.mini-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;width:100%;padding:0 0 6px;border:0;border-bottom:2px solid var(--ink);background:none;cursor:pointer;text-align:left}
.mini-h b{font:400 20px var(--f-display)}
.mini-h small{font:600 10.5px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.mini-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-top:6px}
.mini-g .w{padding:4px 0;text-align:center;font:600 9.5px var(--f-ui);letter-spacing:.06em;color:var(--ink-3)}
.md{position:relative;display:grid;place-items:center;aspect-ratio:1;padding:0;border:0;background:none;font:500 13px var(--f-block);font-variant-numeric:tabular-nums;color:var(--ink-3)}
button.md{font-weight:600;font-size:15px;color:var(--ink);cursor:pointer;border-radius:50%}
button.md:hover{background:color-mix(in srgb,var(--ink) 9%,transparent)}
.md.today{box-shadow:inset 0 0 0 2px var(--gold)}
.dots{position:absolute;left:0;right:0;bottom:8%;display:flex;justify-content:center;gap:2px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--t)}
@media (max-width:560px){ .year{grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 16px} .mini-h b{font-size:17px} .md{font-size:12px} button.md{font-size:13px} .dots i{width:4px;height:4px} .dots{bottom:2%} }

/* list */
.list{display:flex;flex-direction:column;gap:30px;max-width:820px}

/* dialogs */
dialog{width:100%;max-width:min(540px,calc(100vw - 32px));max-height:calc(100vh - 32px);padding:0;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);overflow:auto}
dialog::backdrop{background:var(--backdrop)}
.dlg-tie{height:10px;background:linear-gradient(var(--club) 0 3px,var(--gold) 3px 7px,var(--club) 7px)}
.dlg{display:flex;flex-direction:column;gap:16px;padding:22px 24px 24px}
.dlg-top{display:flex;align-items:center;gap:14px}
.dlg-top .venue{font-size:12px;flex:1;min-width:0}
.x{flex:none;width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:none;font-size:18px;line-height:1;cursor:pointer}
.dlg h2{margin:0;font:400 28px/1.15 var(--f-display);text-wrap:balance;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 18px;margin:0;padding:14px 0;border-block:1px solid var(--line)}
.facts dt{font:600 11px/1.9 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.facts dd{margin:0;font-size:16px}
.desc{margin:0;font:400 16px/1.55 var(--f-display);max-width:60ch;white-space:pre-line}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.acts .btn{flex:1 1 200px;min-height:44px}
.hint{margin:0;font-size:13px;color:var(--ink-2)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:600 11px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.field input[type=file]{font:inherit;padding:10px;border:1px dashed var(--ink-3);border-radius:2px;background:var(--paper);color:var(--ink);max-width:100%}
.sum{margin:0;font:400 20px/1.3 var(--f-display)}
.issues{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;max-height:210px;overflow:auto;font-size:14px}
.issues li{padding:6px 10px;border-left:3px solid var(--gold);background:var(--warn-bg)}
.issues li.error{border-left-color:var(--err)}
.status{margin:0;font-size:14px;min-height:1.4em}
.status.bad{color:var(--err)}

footer{border-top:1px solid var(--line)}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;padding-block:20px 28px;font-size:13px;color:var(--ink-2)}
.foot b{font:italic 400 15px var(--f-display);color:var(--ink)}
.link{padding:0;border:0;background:none;font:600 11px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
@media (prefers-reduced-motion:no-preference){ .btn,.chip,.ev,button.md{transition:background-color .15s,border-color .15s} }
</style>
</head>

/* ───────── Utilidades ───────── */
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function norm(s){ return String(s == null ? "" : s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, ""); }
function p2(n){ return (n < 10 ? "0" : "") + n; }
function iso(y, m, d){ return y + "-" + p2(m) + "-" + p2(d); }
function parts(s){ return {y:+s.slice(0,4), m:+s.slice(5,7), d:+s.slice(8,10)}; }
function utc(s){ var p = parts(s); return Date.UTC(p.y, p.m - 1, p.d); }
function addDays(s, n){ var t = new Date(utc(s) + n * 864e5); return iso(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()); }
function dowOf(s){ return new Date(utc(s)).getUTCDay(); }
function daysIn(y, m){ return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
function todayIso(){ var n = new Date(); return iso(n.getFullYear(), n.getMonth() + 1, n.getDate()); }
function longDate(s, withYear){ var p = parts(s); return DAYS[dowOf(s)] + " " + p.d + " de " + MONTHS[p.m - 1] + (withYear ? " de " + p.y : ""); }
function multi(e){ return !!(e.end && e.end !== e.start); }
function dateText(e){
  if (!multi(e)) return cap(longDate(e.start, true));
  var a = parts(e.start), b = parts(e.end);
  if (a.y === b.y && a.m === b.m) return cap(DAYS[dowOf(e.start)] + " " + a.d + " al " + DAYS[dowOf(e.end)] + " " + b.d + " de " + MONTHS[a.m - 1] + " de " + a.y);
  return cap(longDate(e.start, a.y !== b.y)) + " al " + longDate(e.end, true);
}

/* ───────── Lectura de celdas de la planilla ───────── */
function cellDate(v, d1904){
  if (v === "" || v == null) return "";
  if (typeof v === "number" && isFinite(v)) {
    var n = Math.floor(v + 1e-7) + (d1904 ? 1462 : 0);
    if (n < 30000 || n > 80000) return null;
    var t = new Date(Date.UTC(1899, 11, 30) + n * 864e5);
    return iso(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate());
  }
  var s = String(v).trim(), m, y, mo, d;
  if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))) { d = +m[1]; mo = +m[2]; y = +m[3]; if (y < 100) y += 2000; }
  else if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
  else return null;
  if (y < 2000 || y > 2100 || mo < 1 || mo > 12 || d < 1 || d > daysIn(y, mo)) return null;
  return iso(y, mo, d);
}
function cellTime(v){
  if (v === "" || v == null) return "";
  if (typeof v === "number" && isFinite(v)) {
    if (v >= 1 && v < 24 && v === Math.floor(v)) return p2(v) + ":00";
    var mins = Math.round((v - Math.floor(v)) * 1440); if (mins >= 1440) mins = 1439;
    return p2(Math.floor(mins / 60)) + ":" + p2(mins % 60);
  }
  var m = String(v).trim().match(/^(\d{1,2})(?:\s*[:.h]\s*(\d{2}))?\s*(?:hs?\.?)?$/i);
  if (!m) return null;
  var h = +m[1], mi = m[2] ? +m[2] : 0;
  if (h > 23 || mi > 59) return null;
  return p2(h) + ":" + p2(mi);
}

    var s = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true), raw = u8.subarray(s, s + f.size);

  var get = await unzip(buf), wbx = await get("xl/workbook.xml"), rlx = await get("xl/_rels/workbook.xml.rels");
  if (!wbx || !rlx) throw new Error("xlsx");
  var wb = xml(wbx), rel = {}, shared = [], sheets = {};
  els(xml(rlx), "Relationship").forEach(function(r){ rel[r.getAttribute("Id")] = r.getAttribute("Target"); });
  var pr = els(wb, "workbookPr")[0], d1904 = !!pr && /^(1|true)$/.test(pr.getAttribute("date1904") || "");

  res.innerHTML = '<p class="sum">' + n + (n === 1 ? " fixture listo" : " fixtures listos") + " para publicar en " + out.venues.length + " disciplinas.</p>" +
    (errs ? '<p class="hint">' + errs + (errs === 1 ? " fila no se publica hasta corregirla" : " filas no se publican hasta corregirlas") + " en la planilla.</p>" : "") +
    (out.examples ? '<p class="hint">' + out.examples + (out.examples === 1 ? " fila de ejemplo ignorada." : " filas de ejemplo ignoradas.") + "</p>" : "") +
    (out.issues.length ? '<ul class="issues">' + out.issues.map(function(x){ return '<li class="' + x.level + '">' + esc(x.text) + "</li>"; }).join("") + "</ul>" : "");
  if (!n) { setStatus("La planilla no tiene fixtures para publicar.", true); return; }
  state.pending = {v:1, sample:false, updated:todayIso(), site:DATA.site || "", venues:out.venues, events:out.events};
  pub.disabled = false; setStatus("Revisá el resumen y tocá «Publicar fixtures». Reemplaza toda la agenda actual.");
}
async function publish(){
  if (!state.pending || !state.artifact) return;
  var pub = document.getElementById("ad-publish"); pub.disabled = true; setStatus("Publicando…");
  try { await state.artifact.publish(buildDocument(state.pending)); setStatus("Publicado. La página se actualiza sola en unos segundos."); }
  catch (err) {
    var c = err && err.code;
    if (c === "conflict") setStatus("Alguien publicó una versión más nueva recién. La página se va a recargar: volvé a elegir la planilla.", true);
    else if (c === "rate_limited") { setStatus("Se publicó muchas veces seguidas. Esperá un minuto y probá de nuevo.", true); pub.disabled = false; }
    else if (c === "too_large") setStatus("La planilla es demasiado grande para publicarla. Quitá los eventos de años anteriores y probá de nuevo.", true);
    else if (c === "upstream_error" || !c) { setStatus("No se pudo publicar por un problema del servicio. Probá de nuevo en un momento.", true); pub.disabled = false; }
    else { setStatus("Esta vista es de solo lectura: tu usuario no tiene permiso de edición sobre la página.", true); document.getElementById("ad-open").hidden = true; }
  }
}

      '<div class="layout" id="layout"></div></main>' +
    '<footer><div class="wrap foot"><span><b>' + esc(CLUB) + "</b> · Est. 1888 · Venado Tuerto, Santa Fe</span><span>" +
      (up && !DATA.sample ? "Actualizado el " + up.d + " de " + MONTHS[up.m - 1] + " de " + up.y + " " : "") + '<button class="link" id="ad-open" data-action="admin" hidden>Secretaría</button></span></div></footer>' +
    '<dialog id="ev-dlg" aria-labelledby="ev-h"><div class="dlg-tie"></div><div class="dlg" id="ev-body"></div></dialog>' +
    '<dialog id="ad-dlg" aria-labelledby="ad-h"><div class="dlg-tie"></div><div class="dlg">' +

      '<h2 id="ad-h">Publicar fixtures</h2><p class="hint">Elegí la planilla de Excel del club. La web muestra exactamente lo que hay en la planilla: cada publicación reemplaza la agenda completa.</p>' +
      '<div class="field"><label for="ad-file">Planilla del club (.xlsx)</label><input type="file" id="ad-file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></div>' +
      '<div id="ad-result"></div><p class="status" id="ad-status" role="status"></p>' +
      '<div class="acts"><button class="btn pri" id="ad-publish" data-action="publish" disabled>Publicar fixtures</button></div></div></dialog>';
}

function shift(n){
  if (state.view === "month") { var m = state.m + n; state.y += Math.floor((m - 1) / 12); state.m = ((m - 1) % 12 + 12) % 12 + 1; state.sel = TODAY.slice(0, 7) === iso(state.y, state.m, 1).slice(0, 7) ? TODAY : null; }
  else state.y += n;
}
document.addEventListener("click", function(ev){
  var dlg = ev.target.nodeName === "DIALOG" ? ev.target : null;
  if (dlg) { dlg.close(); return; }
  var el = ev.target.closest("[data-action]"); if (!el) return;
  var a = el.getAttribute("data-action");
  if (a === "event") { var e = byId(el.getAttribute("data-id")); if (e) openEvent(e); return; }
  if (a === "close") { el.closest("dialog").close(); return; }
  if (a === "admin") { document.getElementById("ad-dlg").showModal(); return; }
  if (a === "publish") { publish(); return; }
  if (a === "prev") shift(-1);
  else if (a === "next") shift(1);
  else if (a === "today") { state.y = T.y; state.m = T.m; state.sel = TODAY; }
  else if (a === "view") state.view = el.getAttribute("data-view");
  else if (a === "all") state.off = {};
  else if (a === "filter") { var k = el.getAttribute("data-key"); if (state.off[k]) delete state.off[k]; else state.off[k] = 1; }
  else if (a === "month") { state.m = +el.getAttribute("data-m"); state.view = "month"; state.sel = TODAY.slice(0, 7) === iso(state.y, state.m, 1).slice(0, 7) ? TODAY : null; }
  else if (a === "goto" || a === "day") { var d = el.getAttribute("data-date"), p = parts(d); state.y = p.y; state.m = p.m; state.sel = d; state.view = "month"; }
  save(); renderMain();
  if (a === "day" || a === "goto") { var dp = document.getElementById("day-panel"); if (dp && dp.scrollIntoView && window.matchMedia("(max-width:1039px)").matches) dp.scrollIntoView({block:"nearest", behavior:"smooth"}); }
});
document.addEventListener("change", function(ev){ if (ev.target.id === "ad-file" && ev.target.files && ev.target.files[0]) onFile(ev.target.files[0]); });

shell();
renderMain();
/* Reemplaza los datos (versión independiente: lectura en vivo de la planilla). */
function setData(d){
  DATA.venues = d.venues; DATA.events = d.events; DATA.sample = false;
  if ("updated" in d) DATA.updated = d.updated;
  if (d.site) DATA.site = d.site;
  indexData();
  var keep = {}; DATA.venues.forEach(function(v){ if (state.off[v.key]) keep[v.key] = 1; }); state.off = keep;
  shell(); renderMain();
}
window.__vtp = {setData:setData, parseSheets:parseSheets, cellDate:cellDate, cellTime:cellTime, readWorkbook:readWorkbook, buildDocument:buildDocument, gcalUrl:gcalUrl, waUrl:waUrl};

/* La carga de la planilla solo aparece para quien puede editar la página. */
(async function(){
  try {
    if (!window.claude || !window.claude.use) return;
    var got = await Promise.all([window.claude.use("artifact"), window.claude.use("user")]), art = got[0], user = got[1];
    if (!art) return;
    var can = user ? await user.canEdit() : true;
    if (!can) return;
    state.artifact = art;
    var b = document.getElementById("ad-open"); if (b) b.hidden = false;
  } catch (e) {}
})();
})();

<script id="vtp-live">/* Versión independiente: lee la planilla publicada de Google Sheets cada vez que se abre la página.
   Si no puede leerla, queda la copia de los fixtures que viene dentro de la página. */
(function(){
"use strict";
var SHEET = "2PACX-1vRIvVScy36ng5pzMChbEvXmcYFJb91ZaeYz-jYvNLaGYdmm3i_wzjzKJNvHfd8lR023Cglq4zZn9BlH";            // id de «Publicar en la web» (2PACX-…); vacío = sin lectura en vivo
var GID_FIXTURES = "226074401", GID_DISCIPLINAS = "1439944624";

function csvUrl(gid){ return "https://docs.google.com/spreadsheets/d/e/" + SHEET + "/pub?gid=" + gid + "&single=true&output=csv&t=" + Date.now(); }

/* CSV con comillas, comas y saltos de línea dentro de las celdas. */
function parseCsv(text){
  var rows = [], row = [], cell = "", q = false, i = 0, c;
  text = text.replace(/^﻿/, "");
  for (; i < text.length; i++) {
    c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function get(url){ return fetch(url, {cache:"no-store"}).then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); }); }

function siteUrl(){ return /^https?:$/.test(location.protocol) ? location.origin + location.pathname : ""; }

window.__vtpLive = {parseCsv:parseCsv};
var vtp = window.__vtp;
if (!vtp) return;
if (!SHEET) return;

Promise.all([get(csvUrl(GID_FIXTURES)), get(csvUrl(GID_DISCIPLINAS)).catch(function(){ return null; })]).then(function(res){
  /* Si la hoja Disciplinas no está publicada, Google devuelve Fixtures: se usan las disciplinas guardadas en la página. */
  var fix = parseCsv(res[0]), disc = res[1] && res[1] !== res[0] ? parseCsv(res[1]) : null;
  var saved = []; try { saved = JSON.parse(document.getElementById("vtp-data").textContent).venues || []; } catch (e) {}
  if (fix.length && /<html/i.test(res[0].slice(0, 200))) throw new Error("La planilla no está publicada como CSV");
  var out = vtp.parseSheets(fix, disc, {fallbackVenues:saved});
  if (out.fatal) throw new Error(out.fatal);
  out.issues.forEach(function(x){ console.warn("Planilla:", x.text); });
  vtp.setData({venues:out.venues, events:out.events, updated:"", site:siteUrl()});
}).catch(function(err){
  console.warn("No se pudo leer la planilla en vivo; se muestra la copia guardada.", err);
});
})();
</script>
